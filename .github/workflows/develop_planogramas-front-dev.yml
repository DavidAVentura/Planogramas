# Build y deploy del frontend (front/) al Static Web App de DEV, desde la rama develop.
# Mismo esquema que main_planogramas-front-prod.yml, con secret y variables propios de DEV.
#
# Requiere:
#   - Secret   AZURE_STATIC_WEB_APPS_API_TOKEN_DEV  (token de despliegue del Static Web App de DEV)
#   - Variable VITE_API_URL_DEV                      (ej. https://planogramas-api-dev-....azurewebsites.net/api/v1)
#   - Variable VITE_N8N_VISION_WEBHOOK_URL          (compartida con prod)

name: Build and deploy front to Azure Static Web Apps - DEV

on:
  push:
    branches:
      - develop
    paths:
      - 'front/**'
      - '.github/workflows/develop_planogramas-front-dev.yml'
  workflow_dispatch:

jobs:
  build_and_deploy:
    # Solo en el fork con CI/CD a Azure; en origin (jdaetzcemaco) no existe el token y fallaria.
    if: github.repository == 'DavidAVentura/Planogramas'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: npm ci y build
        working-directory: front
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL_DEV }}
          VITE_N8N_VISION_WEBHOOK_URL: ${{ vars.VITE_N8N_VISION_WEBHOOK_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy a Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}
          action: upload
          app_location: front/dist
          skip_app_build: true
          skip_api_build: true
