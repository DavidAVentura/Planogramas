# Build y deploy del backend (back/) al App Service de DEV, desde la rama develop.
# Reutiliza los secrets OIDC del workflow de prod (misma identidad administrada); la identidad
# necesita una credencial federada para refs/heads/develop y rol sobre planogramas-api-dev.

name: Build and deploy Node.js app to Azure Web App - planogramas-api-dev

on:
  push:
    branches:
      - develop
    paths:
      - 'back/**'
      - '.github/workflows/develop_planogramas-api-dev.yml'
  workflow_dispatch:

jobs:
  build:
    # Solo en el fork con CI/CD a Azure; en origin (jdaetzcemaco) no existen los secrets y fallaria.
    if: github.repository == 'DavidAVentura/Planogramas'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: npm ci
        working-directory: back
        run: npm ci --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: back

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7856561568F44FF09649B8F7C7440F71 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8BB33C2EB20E4E8EB2ABD951D3FF97B4 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6AFA339C713E461DBD047CB2AF86B444 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'planogramas-api-dev'
          package: .
          startup-command: 'node index.js'
