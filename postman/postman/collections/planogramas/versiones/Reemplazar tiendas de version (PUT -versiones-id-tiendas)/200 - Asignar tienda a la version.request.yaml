$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionId}}/tiendas"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tiendaIds": [
        1
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.expect(pm.response.json().tiendas).to.be.an('array').with.lengthOf(1);
    language: text/javascript
order: 1000
