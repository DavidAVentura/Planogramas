$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionIdPublicada}}/estructura"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Forma reducida sin campos de inventario', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('versionId');
        pm.expect(body.gondolas).to.be.an('array');
      });
    language: text/javascript
order: 1000
