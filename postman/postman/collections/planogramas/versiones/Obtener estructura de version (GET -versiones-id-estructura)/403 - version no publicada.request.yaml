$kind: http-request
description: versionId esta en en_desarrollo en este punto de la coleccion (el folder de "Guardar" ya corrio antes).
url: "{{HOST}}/api/v1/versiones/{{versionId}}/estructura"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', () => pm.response.to.have.status(403));
      pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN');
    language: text/javascript
order: 3000
