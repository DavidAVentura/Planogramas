$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionIdPublicada}}/guardar"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.expect(pm.response.json().error.code).to.eql('UNPROCESSABLE');
    language: text/javascript
order: 4000
