$kind: http-request
description: versionId todavia esta en borrador en este punto de la coleccion (el folder de "Guardar" corre despues) -- borrador no puede promoverse directo a piloto.
url: "{{HOST}}/api/v1/versiones/{{versionId}}/promover"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estadoDestino": "piloto",
      "tiendaIds": [
        1
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.expect(pm.response.json().error.code).to.eql('UNPROCESSABLE');
    language: text/javascript
order: 6000
