$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionIdPromover}}/promover"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estadoDestino": "piloto",
      "tiendaIds": [
        1
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Estado piloto con tienda asignada', () => {
        const body = pm.response.json();
        pm.expect(body.estado).to.eql('piloto');
        pm.expect(body.tiendas).to.be.an('array').with.lengthOf(1);
      });
    language: text/javascript
order: 1000
