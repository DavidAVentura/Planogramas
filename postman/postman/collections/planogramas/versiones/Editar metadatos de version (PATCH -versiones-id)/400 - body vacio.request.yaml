$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
    language: text/javascript
order: 2000
