$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionIdInexistente}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND');
    language: text/javascript
order: 3000
