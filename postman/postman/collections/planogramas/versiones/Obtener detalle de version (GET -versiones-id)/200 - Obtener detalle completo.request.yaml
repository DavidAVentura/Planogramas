$kind: http-request
url: "{{HOST}}/api/v1/versiones/{{versionId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Retorna gondolas como array', () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property('id');
        pm.expect(body.gondolas).to.be.an('array');
      });
    language: text/javascript
order: 1000
