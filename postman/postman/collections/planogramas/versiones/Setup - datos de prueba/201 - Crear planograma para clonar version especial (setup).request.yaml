$kind: http-request
url: "{{HOST}}/api/v1/planogramas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Autos - Rack Clonar {{$timestamp}}",
      "departamento": "Autos",
      "subcategorias": [
        "Aceites"
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('planogramaIdClonar', pm.response.json().id);
    language: text/javascript
order: 15000
