$kind: http-request
description: Version que se avanza a en_desarrollo en el siguiente request de setup, lista para el escenario "200 - Promover a piloto".
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdPromover}}/versiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "GRANDE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('versionIdPromover', pm.response.json().id);
    language: text/javascript
order: 4000
