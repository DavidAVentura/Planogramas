$kind: http-request
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdVersiones}}/versiones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Incluye la version creada en el setup', () => {
        const body = pm.response.json();
        pm.expect(body.versiones).to.be.an('array');
        const ids = body.versiones.map((v) => v.id);
        pm.expect(ids).to.include(Number(pm.collectionVariables.get('versionId')));
      });
    language: text/javascript
order: 1000
