$kind: http-request
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdPublicar}}/versiones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('No incluye la version archivada', () => {
        const ids = pm.response.json().versiones.map((v) => v.id);
        pm.expect(ids).to.not.include(Number(pm.collectionVariables.get('versionIdArchivada')));
      });
    language: text/javascript
order: 2000
