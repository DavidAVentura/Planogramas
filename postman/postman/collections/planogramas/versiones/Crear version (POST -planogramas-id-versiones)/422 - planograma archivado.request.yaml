$kind: http-request
description: Reutiliza planogramaIdArchivado (fixture del modulo planogramas).
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdArchivado}}/versiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "GRANDE"
    }
scripts:
