$kind: http-request
name: 409 - la tienda ya tiene una version especial derivada de esa base
description: Repite la combinacion versionBaseId+tiendaId del escenario 201 de clonacion, que ya corrio antes en esta misma carpeta.
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdClonar}}/versiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "GRANDE",
      "versionBaseId": "{{versionIdBaseClonar}}",
      "tiendaId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.expect(pm.response.json().error.code).to.eql('CONFLICT');
    language: text/javascript
order: 8000
