$kind: http-request
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdVersiones}}/versiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "CHIQUITA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
    language: text/javascript
order: 3000
