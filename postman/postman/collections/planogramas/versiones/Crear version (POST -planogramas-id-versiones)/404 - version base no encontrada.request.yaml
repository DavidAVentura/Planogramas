$kind: http-request
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdVersiones}}/versiones"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "tipo": "GRANDE",
      "versionBaseId": 999999,
      "tiendaId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 404', () => pm.response.to.have.status(404));
      pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND');
    language: text/javascript
order: 6000
