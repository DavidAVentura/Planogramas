$kind: http-request
description: El id debe parsear como entero >= 1.
url: "{{HOST}}/api/v1/planogramas/abc"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Code VALIDATION_ERROR', () => {
        pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
      });
    language: text/javascript
order: 2000
