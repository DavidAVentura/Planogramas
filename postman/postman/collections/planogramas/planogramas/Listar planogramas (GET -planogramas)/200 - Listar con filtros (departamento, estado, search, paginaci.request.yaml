$kind: http-request
name: 200 - Listar con filtros (departamento, estado, search, paginacion)
description: Filtra por departamento, estado y texto de búsqueda con paginación explícita.
url: "{{HOST}}/api/v1/planogramas?departamento=Autos&estado=activo&search=rack&page=1&pageSize=10"
method: GET
queryParams:
  departamento: Autos
  estado: activo
  search: rack
  page: "1"
  pageSize: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Respeta pageSize solicitado', () => {
        const body = pm.response.json();
        pm.expect(body.pageSize).to.eql(10);
        pm.expect(body.data.length).to.be.at.most(10);
      });
    language: text/javascript
order: 2000
