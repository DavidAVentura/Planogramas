$kind: http-request
description: "'estado' solo admite borrador | activo | archivado."
url: "{{HOST}}/api/v1/planogramas?estado=invalido"
method: GET
queryParams:
  estado: invalido
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Code VALIDATION_ERROR', () => {
        pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
      });
    language: text/javascript
order: 3000
