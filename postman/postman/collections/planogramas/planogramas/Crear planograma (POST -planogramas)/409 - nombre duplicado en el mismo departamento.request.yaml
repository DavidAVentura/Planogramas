$kind: http-request
description: Requiere que ya exista un planograma con ese mismo nombre + departamento (ajustar variables nombreExistente/departamentoExistente).
url: "{{HOST}}/api/v1/planogramas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{nombreExistente}}",
      "departamento": "{{departamentoExistente}}",
      "subcategorias": ["Aceites"]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Code CONFLICT', () => {
        pm.expect(pm.response.json().error.code).to.eql('CONFLICT');
      });
    language: text/javascript
order: 3000
