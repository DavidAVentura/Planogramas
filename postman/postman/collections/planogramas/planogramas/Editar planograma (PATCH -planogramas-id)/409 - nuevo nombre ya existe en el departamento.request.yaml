$kind: http-request
description: El nombre/departamento resultante colisiona con otro planograma existente.
url: "{{HOST}}/api/v1/planogramas/{{planogramaId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "{{nombreExistente}}",
      "departamento": "{{departamentoExistente}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Code CONFLICT', () => {
        pm.expect(pm.response.json().error.code).to.eql('CONFLICT');
      });
    language: text/javascript
order: 4000
