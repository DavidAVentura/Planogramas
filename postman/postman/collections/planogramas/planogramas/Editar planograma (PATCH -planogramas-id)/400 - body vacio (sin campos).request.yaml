$kind: http-request
description: El schema exige al menos un campo (nombre, departamento o subcategorias).
url: "{{HOST}}/api/v1/planogramas/{{planogramaId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Code VALIDATION_ERROR', () => {
        pm.expect(pm.response.json().error.code).to.eql('VALIDATION_ERROR');
      });
    language: text/javascript
order: 2000
