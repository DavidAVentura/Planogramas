$kind: http-request
description: Solo se puede editar en estado borrador o activo; un planograma archivado responde 422.
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdArchivado}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Intento de editar archivado"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Code UNPROCESSABLE', () => {
        pm.expect(pm.response.json().error.code).to.eql('UNPROCESSABLE');
      });
    language: text/javascript
order: 5000
