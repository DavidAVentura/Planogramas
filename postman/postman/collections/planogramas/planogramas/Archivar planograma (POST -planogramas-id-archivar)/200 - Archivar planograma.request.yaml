$kind: http-request
description: Requiere un planograma que no esté ya archivado ni tenga versiones publicadas asignadas a tiendas.
url: "{{HOST}}/api/v1/planogramas/{{planogramaId}}/archivar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Queda en estado archivado', () => {
        pm.expect(pm.response.json().estado).to.eql('archivado');
      });
    language: text/javascript
order: 1000
