$kind: http-request
description: El planograma referenciado tiene versiones publicadas asignadas a tiendas y no puede archivarse.
url: "{{HOST}}/api/v1/planogramas/{{planogramaIdConVersionesPublicadas}}/archivar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Code UNPROCESSABLE', () => {
        pm.expect(pm.response.json().error.code).to.eql('UNPROCESSABLE');
      });
    language: text/javascript
order: 4000
